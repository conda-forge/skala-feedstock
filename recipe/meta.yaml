{% set version = "2026.9" %}

package:
  name: skala
  version: "{{ version }}"

source:
  url: https://github.com/microsoft/skala/archive/v{{ version }}.tar.gz
  sha256: e9282b09def32916cf58320e5c6194cab73f9d92226ccdd27e5624080bf48a87

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - ase
    - dftd3-python >=1.2.1
    - e3nn
    - huggingface_hub
    - numpy
    - opt_einsum_fx
    - pyscf >=2.11,<2.15
    - pyscf-dispersion >=1.5
    - python >={{ python_min }}
    - pytorch >=2.9

test:
  imports:
    - skala
    - skala.ase
    - skala.functional
    - skala.pyscf
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://aka.ms/dft
  dev_url: https://github.com/microsoft/skala
  doc_url: https://microsoft.github.io/skala
  summary: Skala Exchange Correlation Functional
  license: MIT
  license_file:
    - NOTICE.md
    - LICENSE.txt

extra:
  recipe-maintainers:
    - awvwgk
